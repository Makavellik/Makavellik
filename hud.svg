    </circle>
    
    <circle cx="196" cy="99" r="3" fill="#ffaa00">
      <animate attributeName="r" values="3;8;3" dur="0.9281288678276208s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="233" cy="151" r="3" fill="#ffaa00">
      <animate attributeName="r" values="3;8;3" dur="0.9774103351182479s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="140" cy="168" r="3" fill="#ffaa00">
      <animate attributeName="r" values="3;8;3" dur="1.286472567707629s" repeatCount="indefinite"/>
    </circle>
    

<rect x="20" y="420" width="39" height="8" fill="#ffaa00" class="glow"/>
<rect x="20" y="440" width="282" height="8" fill="#ffaa00"/>

<text x="20" y="30" class="text">LATENCY: 53 ms</text>
