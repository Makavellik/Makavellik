    </circle>
    
    <circle cx="293" cy="421" r="3" fill="#ffaa00">
      <animate attributeName="r" values="3;8;3" dur="0.8823038367141587s" repeatCount="indefinite"/>
    </circle>
    

<rect x="20" y="420" width="51" height="8" fill="#ffaa00" class="glow"/>
<rect x="20" y="440" width="162" height="8" fill="#ffaa00"/>

<text x="20" y="30" class="text">LATENCY: 43 ms</text>
